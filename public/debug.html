<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rita Dolls · диагностика</title>
<style>
  :root { color-scheme: dark; }
  body{margin:0;background:#0E0D10;color:#EDE6DC;
       font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
       padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 40px}
  h1{font-size:16px;color:#FF96C9;letter-spacing:.1em;margin:0 0 4px}
  p.sub{color:#8E8496;font-size:13px;margin:0 0 20px}
  /* Зонд: его высота — и есть реальный отступ безопасной зоны */
  #probe{height:env(safe-area-inset-top,0px);width:1px;position:absolute;visibility:hidden}
  table{border-collapse:collapse;width:100%}
  td{padding:7px 8px;border-bottom:1px dashed #514C58;vertical-align:top}
  td:first-child{color:#8E8496;white-space:nowrap;padding-right:14px}
  td:last-child{color:#E8C46A;font-weight:700;text-align:right}
  .ok{color:#8FCB8F!important}.bad{color:#FF6B8A!important}
  .band{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);
        background:#FF96C9;z-index:99}
  .note{margin-top:22px;color:#8E8496;font-size:13px;line-height:1.7}
</style></head>
<body>
<div id="probe"></div>
<div class="band" title="розовая полоса = зона безопасности"></div>

<h1>ДИАГНОСТИКА ШАПКИ</h1>
<p class="sub">Пришли скриншот этой страницы</p>
<table id="t"></table>

<p class="note">
  Розовая полоса сверху — это зона под вырезом. Если её видно —
  <b>env() работает</b>. Если полосы нет и первая строка ниже равна 0 —
  значит браузер не отдаёт отступ, и полосу над шапкой закрыть
  этим способом нельзя.
</p>

<script>
const probe = getComputedStyle(document.getElementById('probe')).height;
const insetPx = parseFloat(probe) || 0;
const rows = [
  ['env(safe-area-inset-top)', probe, insetPx > 0],
  ['viewport-fit', document.querySelector('meta[name=viewport]').content.includes('cover') ? 'cover ✓' : 'НЕ cover', document.querySelector('meta[name=viewport]').content.includes('cover')],
  ['window.innerHeight', innerHeight + 'px', null],
  ['screen.height', screen.height + 'px', null],
  ['visualViewport.height', (visualViewport ? Math.round(visualViewport.height) : '—') + 'px', null],
  ['visualViewport.offsetTop', (visualViewport ? Math.round(visualViewport.offsetTop) : '—') + 'px', null],
  ['devicePixelRatio', devicePixelRatio, null],
  ['поддержка position:sticky', CSS.supports('position','sticky') ? 'да' : 'НЕТ', CSS.supports('position','sticky')],
  ['поддержка overflow:clip', CSS.supports('overflow','clip') ? 'да' : 'НЕТ', CSS.supports('overflow','clip')],
  ['поддержка backdrop-filter', (CSS.supports('backdrop-filter','blur(1px)')||CSS.supports('-webkit-backdrop-filter','blur(1px)')) ? 'да' : 'НЕТ', null],
  ['браузер', (navigator.userAgent.match(/(iPhone|iPad|Android)[^)]*/) || ['—'])[0], null],
  ['версия Safari/Chrome', (navigator.userAgent.match(/(Version|CriOS|Chrome)\/[\d.]+/) || ['—'])[0], null],
];
document.getElementById('t').innerHTML = rows.map(([k,v,ok]) =>
  `<tr><td>${k}</td><td class="${ok===true?'ok':ok===false?'bad':''}">${v}</td></tr>`).join('');
</script>
</body></html>
